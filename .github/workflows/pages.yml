# Publish class materials to GitHub Pages.
#
# Only `output/*/materials/**` is deployed. Everything else in the repository
# (syllabus workbooks, `docs/`, skill definitions) stays out of the published
# site: the staging step copies materials directories explicitly rather than
# excluding unwanted paths, so a newly added directory is never published by
# accident.
#
# The repository fuses year and subject into one directory name; the site
# splits them so a reader can walk year -> subject -> page:
#   https://<owner>.github.io/<repo>/<YYYY>/<subject>/<page>.html
# Subject and page names stay in Japanese and are percent-encoded by the
# browser. A page keeps its own `assets/` as a sibling, so the relative links
# inside it resolve at any depth and the pages need no rewriting.
#
# Index pages (one per level) are generated here rather than committed, so
# adding a material page publishes it to the listings with no further edit.

name: Deploy materials to Pages

on:
  push:
    branches: [main]
    paths:
      - 'output/*/materials/**'
      - 'scripts/build_index.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish; queue at most one follow-up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage materials
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s nullglob
          found=0
          for dir in output/*/materials/; do
            folder="$(basename "$(dirname "$dir")")"
            # `output/` fuses year and subject into one directory name; the
            # site splits them so the URL can be walked year by year.
            year="${folder%%_*}"
            subject="${folder#*_}"
            mkdir -p "_site/$year/$subject"
            cp -R "$dir." "_site/$year/$subject/"
            found=1
            echo "staged: $year/$subject"
          done
          if [ "$found" -eq 0 ]; then
            echo "no materials directory found under output/" >&2
            exit 1
          fi
          # Skip Jekyll so that files and directories starting with `_` or `.`
          # are served as-is.
          touch _site/.nojekyll

      - name: Build index pages
        run: python3 scripts/build_index.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
